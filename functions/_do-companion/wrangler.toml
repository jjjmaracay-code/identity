# Worker COMPAÑERO del proyecto Pages de IDENTIFLY. Aloja el único
# Durable Object de Business (BusinessCardDO): un coordinador por
# propietario que serializa publicar/actualizar/despublicar/reactivar
# para esa cuenta.
#
# NO DESPLEGADO. Un solo archivo define DOS despliegues (Production y
# Preview) como dos Workers con nombre distinto -- cada uno con su propia
# instancia de Durable Object y, por tanto, datos de prueba totalmente
# separados de producción, tal como exige la instrucción.
#
#   wrangler deploy                 -> despliega "identifly-business-do" (Production)
#   wrangler deploy --env preview   -> despliega "identifly-business-do-preview" (Preview)
#
# `workers_dev = false`: este Worker no necesita ni debe tener una URL
# pública propia (*.workers.dev) -- todo el tráfico real llega a través
# del binding desde el proyecto Pages, nunca por una petición HTTP
# directa a este Worker (ver business-card-do.js, cuyo export default ya
# responde 404 a cualquier tráfico directo como segunda capa).
#
# Este archivo vive dentro de functions/_do-companion/ (excluido del
# contenido estático y del enrutado de Pages por construcción, ver la
# cabecera de business-card-do.js) pero se DESPLIEGA por separado, nunca
# como parte del build de Pages: `wrangler deploy` ejecutado DESDE esta
# carpeta empaqueta únicamente este directorio como su propio Worker.
#
# Namespaces BUSINESS_KV creados el 2026-09-29 (modo lectura confirmó que
# no existía ninguno antes): "identifly_business" (Production, id abajo)
# e "identifly_business_preview" (Preview, id abajo). Deben ser LOS
# MISMOS namespaces que use el proyecto Pages para BUSINESS_KV, no unos
# aparte: este Worker solo necesita escribir/leer el índice público
# id->propietario ('bizid:'), que la tarjeta pública (dentro del
# proyecto Pages) consulta del mismo sitio.
name = "identifly-business-do"
main = "business-card-do.js"
# Igual que la fecha de compatibilidad real del proyecto Pages
# (verificado en modo lectura: `wrangler pages download config identity`
# devuelve compatibility_date = "2026-06-13") -- evita cualquier
# diferencia de comportamiento del runtime entre este Worker y Pages.
compatibility_date = "2026-06-13"
workers_dev = false

[[durable_objects.bindings]]
name = "BUSINESS_DO"
class_name = "BusinessCardDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BusinessCardDO"]

[[kv_namespaces]]
binding = "BUSINESS_KV"
id = "5ec19ea6cc88459b99c990924ab94b9c" # identifly_business (Production)

[env.preview]
name = "identifly-business-do-preview"

# wrangler NO hereda "durable_objects" de nivel superior en un entorno
# nombrado (avisó de esto al desplegar por primera vez) -- hay que
# repetirlo aquí explícitamente, o el Worker de Preview se despliega sin
# ningún Durable Object accesible.
[[env.preview.durable_objects.bindings]]
name = "BUSINESS_DO"
class_name = "BusinessCardDO"

[[env.preview.kv_namespaces]]
binding = "BUSINESS_KV"
id = "9d75e4fc19cf48679c1729704b14ae4f" # identifly_business_preview
